name = "rental-v2"
main = "worker-cron.js"
compatibility_date = "2026-05-29"
compatibility_flags = ["nodejs_compat", "global_fetch_strictly_public"]

[assets]
directory = ".open-next/assets"
binding = "ASSETS"

[[services]]
binding = "WORKER_SELF_REFERENCE"
service = "rental-v2"

[[r2_buckets]]
binding = "BACKUP_BUCKET"
bucket_name = "pananth-rental-backup"

[triggers]
# 02:00 UTC = 09:00 Thai time (UTC+7)
crons = ["0 2 * * *"]

[vars]
# ตั้งค่า environment variables ใน Cloudflare dashboard > Workers > rental > Settings > Variables
# NEXT_PUBLIC_SUPABASE_URL = "..."
# NEXT_PUBLIC_SUPABASE_ANON_KEY = "..."
# ตั้งเป็น Secret ไม่ใช่ plain var: ENCRYPTION_KEY

