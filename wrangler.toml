name = "rental-v2"
main = ".open-next/worker.js"
compatibility_date = "2026-05-29"
compatibility_flags = ["nodejs_compat", "global_fetch_strictly_public"]

[assets]
directory = ".open-next/assets"
binding = "ASSETS"

[[services]]
binding = "WORKER_SELF_REFERENCE"
service = "rental-v2"

# Cron is handled by external service (cron-job.org) calling:
#   GET /api/cron/reminders?secret=CRON_SECRET   (daily 09:00 Thai)
#   GET /api/cron/contracts?secret=CRON_SECRET   (daily 09:00 Thai)
# The reminders endpoint self-checks reminder_days, so calling daily is safe.

[vars]
# ตั้งค่า environment variables ใน Cloudflare dashboard > Workers > rental > Settings > Variables
# NEXT_PUBLIC_SUPABASE_URL = "..."
# NEXT_PUBLIC_SUPABASE_ANON_KEY = "..."
# ตั้งเป็น Secret ไม่ใช่ plain var: ENCRYPTION_KEY

