name = "rental-v2"
main = ".open-next/worker.js"
compatibility_date = "2026-05-29"
compatibility_flags = ["nodejs_compat", "global_fetch_strictly_public"]

[assets]
directory = ".open-next/assets"
binding = "ASSETS"

[[services]]
binding = "WORKER_SELF_REFERENCE"
service = "rental-v2"

# Cron triggers — 09:00 Thai = 02:00 UTC
# reminders: days 5,10,15,20,25 | contracts: daily
[triggers]
crons = [
  "0 2 5,10,15,20,25 * *",
  "0 2 * * *"
]

[vars]
# ตั้งค่า environment variables ใน Cloudflare dashboard > Workers > rental > Settings > Variables
# NEXT_PUBLIC_SUPABASE_URL = "..."
# NEXT_PUBLIC_SUPABASE_ANON_KEY = "..."
# ตั้งเป็น Secret ไม่ใช่ plain var: ENCRYPTION_KEY

